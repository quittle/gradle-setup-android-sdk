buildscript {
    repositories {
        mavenCentral()
    }

    dependencies {
        classpath 'org.eclipse.jgit:org.eclipse.jgit:6.3.0.202209071007-r'
    }
}

import org.eclipse.jgit.api.Git

plugins {
    id 'com.github.spotbugs' version '5.0.13'
    id 'com.gradle.plugin-publish' version '2.2.1'
    id 'java-gradle-plugin'
    id 'maven-publish'
    id 'pmd'
}

repositories {
    google()
    mavenCentral()
}

group = 'com.quittle'
version = Git.open(project.rootDir.parentFile)
        .describe()
        .setTarget('HEAD')
        .setTags(true)
        .call()

gradlePlugin {
    plugins {
        setupAndroidSdkPlugin {
            id = 'com.quittle.setup-android-sdk'
            displayName = 'Setup Android SDK'
            description = 'Automatically installs Android SDK dependencies for Android Gradle builds.'
            implementationClass = 'com.quittle.setupandroidsdk.SetupAndroidSdkPlugin'
        }
    }
}

publishing {
    publications {
        maven(MavenPublication) {
            artifactId = 'setup-android-sdk'
            from components.java
        }
    }
}

pluginBundle {
    website = 'https://github.com/quittle/gradle-setup-android-sdk'
    vcsUrl = 'https://github.com/quittle/gradle-setup-android-sdk'
    tags = ['android', 'android sdk', 'installer']
}

dependencies {
    compileOnly 'com.android.tools.build:gradle:7.3.1'
    implementation 'commons-io:commons-io:2.11.0'

    annotationProcessor 'com.github.spotbugs:spotbugs-annotations:4.10.4'
    compileOnly 'com.github.spotbugs:spotbugs-annotations:4.10.4'

    testImplementation 'org.junit.jupiter:junit-jupiter:5.9.2'
    testImplementation 'org.junit.jupiter:junit-jupiter-api:5.9.1'
    testImplementation 'com.github.spotbugs:spotbugs-annotations:4.10.4'
}

tasks.withType(JavaCompile) {
    // Pin emitted bytecode to Java 11 even though the build runs on a newer JDK,
    // so consumers on older JVMs keep working. --release also avoids the
    // bootstrap-classpath warning that -Werror would turn into an error.
    options.release = 11
    options.compilerArgs << '-Xlint:all' << '-Werror'
}

// Tests aren't shipped to consumers, so the test source set opts back out of
// the Java 11 pin: Gradle stamps org.gradle.jvm.version from each source
// set's compile task release flag, and junit-jupiter 6.x only publishes a
// Java 17 variant. Test classes become Java 17 bytecode and run on JDK 17.
tasks.named('compileTestJava') {
    options.release = 17
}

tasks.withType(com.github.spotbugs.snom.SpotBugsTask) {
    reports {
        xml.enabled = false
        html.enabled = true
    }
}

javadoc {
    failOnError true
    options.addStringOption 'Xwerror', '-quiet' // See https://stackoverflow.com/a/49544352
    exclude 'com/quittle/setupandroidsdk/AndroidRevision.java'

    if(JavaVersion.current() != JavaVersion.VERSION_1_8){
        options.addBooleanOption 'html5', true
    }
}

pmd {
    incrementalAnalysis = true
}

spotbugs {
    effort 'max'
    reportLevel 'low'
}

defaultTasks 'assemble', 'javadoc', 'check'
